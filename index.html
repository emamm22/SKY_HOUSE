<style>
:root{--bg:#0e1116;--bg2:#151a22;--ivory:#f5f0e8;--stone:#b9b1a4;--gold:#b8996a;--line:#ffffff1f;--pt:env(safe-area-inset-top,0px);--pb:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{color-scheme:dark}}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{font-family:Cairo,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ivory);line-height:1.8;overflow-x:hidden;padding-top:var(--pt)}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.wrap{width:min(1180px,90%);margin-inline:auto}
section{padding:clamp(64px,10vw,120px) 0}
.eyebrow{color:var(--gold);letter-spacing:.18em;font-size:.8rem;text-transform:uppercase}
h1,h2,h3{font-weight:300;line-height:1.3}
h2{font-size:clamp(1.8rem,4vw,2.9rem);margin:8px 0 18px}
.lead{color:var(--stone);max-width:560px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 30px;border:1px solid var(--gold);color:var(--ivory);background:transparent;font:600 .95rem Cairo,sans-serif;cursor:pointer;transition:.3s}
.btn.solid{background:var(--gold);color:#14110c}
.btn:hover,.btn:focus-visible{background:var(--ivory);color:var(--bg);border-color:var(--ivory)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
/* header */
header{position:fixed;inset-inline:0;top:0;z-index:50;padding-top:var(--pt);transition:.4s}
header.solid{background:#0e1116ec;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:72px;gap:18px}
.brand{font-weight:700;letter-spacing:.25em;font-size:1.05rem;display:flex;align-items:center;gap:10px}
.brand img{height:38px;width:auto}.brand b{color:var(--gold);font-weight:700}
.menu{display:flex;gap:26px;align-items:center;font-size:.92rem}
.menu a:not(.btn){color:var(--stone);transition:.3s}.menu a:not(.btn):hover{color:var(--ivory)}
.menu .btn{min-height:40px;padding:0 20px}
.lang{display:flex;gap:6px;font-size:.85rem;direction:ltr}
.lang button{background:none;border:0;color:var(--stone);cursor:pointer;font:inherit;padding:6px 4px}
.lang button[aria-pressed=true]{color:var(--gold);border-bottom:1px solid var(--gold)}
.burger{display:none;background:none;border:1px solid var(--line);width:46px;height:46px;color:var(--ivory);cursor:pointer;font-size:1.2rem}

.hero{min-height:100svh;display:flex;align-items:flex-end;position:relative;padding:130px 0 70px;background:radial-gradient(900px 500px at 80% 20%,#b8996a22,transparent 60%),linear-gradient(160deg,#151a22,#0e1116 70%);overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 119px,#ffffff08 119px 120px);pointer-events:none}
.hero-img{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.6s}
.hero-img.on{opacity:1}
.hero-img::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,#0e1116f2 5%,#0e111670 60%,#0e111633)}
.hero .wrap{position:relative;z-index:2}
.hero h1{font-size:clamp(2.2rem,6.4vw,4.8rem);max-width:15ch;margin:14px 0 20px}
.hero .lead{font-size:1.1rem;margin-bottom:34px}
.cta{display:flex;gap:14px;flex-wrap:wrap}
/* reveal */
.rv{opacity:0;transform:translateY(26px);transition:opacity .9s,transform .9s}
.rv.in{opacity:1;transform:none}
.hero .rv{animation:up 1s .15s both}
@keyframes up{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
/* portfolio */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:26px 0 34px}
.filters button{background:none;border:1px solid var(--line);color:var(--stone);padding:6px 18px;cursor:pointer;font:inherit;font-size:.88rem;min-height:40px;transition:.3s}
.filters button[aria-pressed=true]{border-color:var(--gold);color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.card{position:relative;grid-column:span 4;aspect-ratio:4/5;overflow:hidden;cursor:zoom-in;background:var(--bg2);border:0;padding:0;color:inherit;text-align:start}
.card:nth-child(5n+1){grid-column:span 7;aspect-ratio:16/11}
.card:nth-child(5n+2){grid-column:span 5;aspect-ratio:auto}
.card img{width:100%;height:100%;object-fit:cover;transition:transform 1.1s}
.card:hover img{transform:scale(1.05)}
.card figcaption,.card .cap{position:absolute;inset-inline:0;bottom:0;padding:50px 20px 18px;background:linear-gradient(transparent,#0e1116ee);transition:.4s}
.cap small{color:var(--gold);display:block;font-size:.78rem}.cap b{font-weight:600;display:block}.cap span{color:var(--stone);font-size:.86rem;display:block}
.card[hidden]{display:none}.slot{cursor:default;min-height:260px;border:1px dashed #ffffff33;background:linear-gradient(135deg,#151a22,#0e1116)}.slot .cap{inset:0;background:none;display:flex;flex-direction:column;justify-content:flex-end}
.pk{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:36px 0 18px}.pkg{border:1px solid var(--line);padding:32px 26px;display:flex;flex-direction:column;gap:10px}.pkg.f{border-color:var(--gold);background:#b8996a0f}.pkg small{color:var(--gold)}.pkg h3{font-size:1.5rem}.pkg .pr{font-size:1.25rem;font-weight:600}.pkg ul{padding-inline-start:18px;color:var(--stone);flex:1;margin-bottom:12px}.note{color:var(--stone);font-size:.88rem}.empty{grid-column:1/-1;border:1px solid var(--line);padding:70px 20px;text-align:center;color:var(--stone);letter-spacing:.05em}
dialog{border:0;background:#080a0ef2;color:var(--ivory);width:100%;height:100%;max-width:none;max-height:none;padding:4vw}
dialog::backdrop{background:#000}
dialog img{max-height:78vh;margin:auto;object-fit:contain}
dialog p{text-align:center;margin-top:14px;color:var(--stone)}
dialog button{position:absolute;top:calc(14px + var(--pt));inset-inline-end:16px;background:none;border:1px solid var(--line);color:var(--ivory);width:46px;height:46px;font-size:1.3rem;cursor:pointer}

.svc{margin-top:36px;border-top:1px solid var(--line)}
.svc div{display:grid;grid-template-columns:70px 1fr 1.3fr;gap:20px;padding:24px 0;border-bottom:1px solid var(--line);align-items:baseline;transition:.4s}
.svc div:hover{padding-inline-start:14px}
.svc i{font-style:normal;color:var(--gold);font-size:.9rem;letter-spacing:.1em}
.svc h3{font-size:1.35rem}.svc p{color:var(--stone)}
/* journey */
.alt{background:var(--bg2)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:40px;counter-reset:s}
.step{padding:28px 24px;border:1px solid var(--line);margin:0 -1px -1px 0}
.step i{font-style:normal;font-size:2.6rem;font-weight:300;color:var(--gold);display:block;line-height:1.2}
.step p{color:var(--stone);margin-top:6px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:clamp(30px,6vw,80px);align-items:center}
.two p+p{margin-top:14px}.two p{color:var(--stone)}
.vals{border-inline-start:1px solid var(--gold);padding-inline-start:30px}
.vals li{list-style:none;padding:10px 0;font-size:1.15rem;border-bottom:1px solid var(--line)}
.quote{text-align:center}.quote .lead{margin:0 auto 28px}

form{display:grid;gap:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{font-size:.85rem;color:var(--stone);display:block}
input,select{width:100%;min-height:50px;background:transparent;border:1px solid var(--line);color:var(--ivory);padding:0 14px;font:inherit;margin-top:4px;border-radius:0}
select option{background:var(--bg);color:var(--ivory)}

.err{color:#e8a090;font-size:.8rem;min-height:1.2em;display:block}
#status{min-height:1.6em;font-size:.92rem}
.ok{color:#9fd3a8}.bad{color:#e8a090}
.links{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
footer{border-top:1px solid var(--line);padding:34px 0 calc(34px + var(--pb));color:var(--stone);font-size:.88rem}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.fab{position:fixed;inset-inline-start:16px;bottom:calc(16px + var(--pb));z-index:40;display:none}
#toast{position:fixed;inset-inline:16px;bottom:calc(20px + var(--pb));z-index:99;background:var(--ivory);color:var(--bg);padding:14px 18px;max-width:420px;margin-inline:auto;transform:translateY(160%);transition:.4s;text-align:center}
#toast.show{transform:none}

.fab{display:inline-flex}

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let lang="ar", cat="all"; const live=[];
try{lang=localStorage.getItem("sh_lang")||"ar"}catch(e){}
if(!T[lang])lang="ar";
const cfgOK=v=>v&&!v.startsWith("PUT_");

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),3800)}
function openWA(text){if(!cfgOK(WHATSAPP_NUMBER)){toast(T[lang].v_cfg);return false}window.open("https://wa.me/"+WHATSAPP_NUMBER.replace(/\D/g,"")+"?text="+encodeURIComponent(text),"_blank","noopener");return true}

function render(){
 const d=T[lang],h=document.documentElement;
 h.lang=lang;h.dir=lang==="ar"?"rtl":"ltr";
 document.title=d.meta_t;
 $('meta[name=description]').content=d.meta_d;
 $('meta[property="og:title"]').content=d.meta_t;$('meta[property="og:description"]').content=d.meta_d;
 $$("[data-i18n]").forEach(e=>e.textContent=d[e.dataset.i18n]);
 $("#svc").innerHTML=d.svc.map((s,i)=>`<div class="rv in"><i>${String(i+1).padStart(2,"0")}</i><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join("");
 $("#steps").innerHTML=d.jr.map((s,i)=>`<div class="step rv in"><i>${String(i+1).padStart(2,"0")}</i><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join("");
 $("#pk").innerHTML=d.pk.map((k,i)=>`<div class="pkg${i==1?" f":""}"><small>${k[0]}</small><h3>${k[1]}</h3><div class="pr">${k[2]}</div><ul>${k[3].map(x=>`<li>${x}</li>`).join("")}</ul><a class="btn" href="#contact">${d.p_btn}</a></div>`).join("");
 const sel=$("#ft"),cur=sel.selectedIndex;sel.innerHTML=d.types.map(t=>`<option>${t}</option>`).join("");sel.selectedIndex=Math.max(cur,0);
 $$(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
 $$(".err").forEach(e=>e.textContent="");
 drawWork();
}
function drawWork(){
 const d=T[lang],cats=["all",...new Set(PROJECTS.map(p=>p.category))];
 $("#filters").innerHTML=cats.map(c=>`<button type="button" data-c="${c}" aria-pressed="${c===cat}">${d["cat_"+c]||c}</button>`).join("");
 $("#grid").innerHTML=PROJECTS.map((p,i)=>[p,i]).filter(([p])=>cat==="all"||p.category===cat).map(([p,i])=>p.ok
  ?`<button type="button" class="card" data-i="${i}"><img src="${p.image}" alt="${p.alt[lang]}" loading="lazy"><span class="cap"><small>${d["cat_"+p.category]||""}</small><b>${p.title[lang]}</b><span>${p.desc[lang]}</span></span></button>`
  :`<div class="card slot"><span class="cap"><small>${d["cat_"+p.category]||""}</small><b>${p.title[lang]}</b><span>${p.desc[lang]}</span></span></div>`).join("");
}
function loadWork(){PROJECTS.forEach(p=>{const i=new Image();i.onload=()=>{p.ok=true;drawWork()};i.src=p.image})}

document.addEventListener("click",e=>{
 const l=e.target.closest(".lang button");
 if(l){lang=l.dataset.l;try{localStorage.setItem("sh_lang",lang)}catch(x){}render();return}
 const f=e.target.closest("#filters button");if(f){cat=f.dataset.c;drawWork();return}
 const c=e.target.closest(".card:not(.slot)");
 if(c){const p=PROJECTS[c.dataset.i];$("#lbi").src=p.image;$("#lbi").alt=p.alt[lang];$("#lbc").textContent=p.title[lang]+" — "+p.desc[lang];$("#lb").showModal();return}
 if(e.target.closest(".wa")){openWA(T[lang].wa_msg);return}
 if(e.target.closest("#menu a"))closeMenu();
});
$("#lbx").onclick=()=>$("#lb").close();
$("#lb").addEventListener("click",e=>{if(e.target.id==="lb")e.target.close()});
const closeMenu=()=>{$("#menu").classList.remove("open");$("#burger").setAttribute("aria-expanded","false");$("#burger").textContent="☰"};
$("#burger").onclick=()=>{const o=$("#menu").classList.toggle("open");$("#burger").setAttribute("aria-expanded",o);$("#burger").textContent=o?"✕":"☰"};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMenu()});
addEventListener("scroll",()=>$("#hd").classList.toggle("solid",scrollY>40),{passive:true});

$("#f").addEventListener("submit",e=>{
 e.preventDefault();const d=T[lang],f=e.target;let ok=true;
 [["fn",v=>v.trim().length>1,"v_req"],["fp",v=>/^[+\d][\d\s-]{6,}$/.test(v.trim()),"v_phone"],["fl",v=>v.trim().length>1,"v_req"]].forEach(([id,fn,k])=>{
  const i=$("#"+id),good=fn(i.value);i.setAttribute("aria-invalid",!good);i.nextElementSibling.textContent=good?"":d[good?"":k];if(!good)ok=false});
 const st=$("#status");
 if(!ok){st.className="bad";st.textContent="";return}
 const msg=`${d.wa_msg}\n${d.wa_n}: ${$("#fn").value}\n${d.wa_p}: ${$("#fp").value}\n${d.wa_l}: ${$("#fl").value}\n${d.wa_a}: ${$("#fa").value||"-"}\n${d.wa_t}: ${$("#ft").value}`;
 if(openWA(msg)){st.className="ok";st.textContent=d.v_ok}else{st.className="bad";st.textContent=d.v_cfg}
});

if("IntersectionObserver"in window){const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.12});$$("section:not(.hero) .rv").forEach(el=>io.observe(el));$$("section:not(.hero) .rv").forEach(el=>el.classList.remove("in"))}else $$(".rv").forEach(el=>el.classList.add("in"));
$("#yr").textContent=new Date().getFullYear();
if(cfgOK(FACEBOOK_PAGE_URL)){$("#fb").href=FACEBOOK_PAGE_URL;$("#fb").hidden=false}
const lg=new Image();lg.onload=()=>{$("#logo").src=LOGO_PATH;$("#logo").hidden=false;$("#wm").hidden=true};lg.src=LOGO_PATH;
const hi=new Image();hi.onload=()=>{$("#heroimg").style.backgroundImage=`url(${HERO_IMAGE})`;$("#heroimg").classList.add("on")};hi.src=HERO_IMAGE;
render();loadWork();
</script>
